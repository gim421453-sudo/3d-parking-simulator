name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript 검사
        run: npm run typecheck
      - name: 단위 테스트 (센서/물리/주차 판정/맵 무결성)
        run: npm test
      - name: 프로덕션 빌드
        run: npm run build
