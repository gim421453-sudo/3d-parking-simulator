name: Android APK (debug, manual)

# 수동 실행 전용. push/PR 로 자동 실행하지 않는다. (Actions → "Android APK (debug, manual)" → Run workflow)
# 실행 전 로컬에서 npm run typecheck && npm test && npm run build 를 통과시킬 것 (이 워크플로는 테스트를 다시 돌리지 않는다).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Capacitor 8 요구사항
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 / AGP 요구사항

      - name: Android SDK 설정
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: 웹 게임 빌드 → Capacitor Android 동기화
        run: |
          npm run build
          npx cap sync android

      - name: assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          # versionCode = 실행 번호(항상 증가). 서명은 저장소의 공개 디버그 키스토어로 항상 동일. (docs/ANDROID.md)
          ./gradlew assembleDebug --stacktrace --info -PversionCode=${{ github.run_number }} 2>&1 | tee ../gradle-build.log

      - name: APK 정보 확인
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|launchable-activity" || true
          "$BT/apksigner" verify --print-certs "$APK" | head -3 || true

      - name: APK 업로드 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: parking-simulator-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 실패 로그 업로드 (실패했을 때만)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.run_number }}
          path: |
            gradle-build.log
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
